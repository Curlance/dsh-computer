<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">dsh-computer</title><desc id="desc">Observe, act and verify on a real Windows desktop with a visible AI cursor.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12152c"/><stop offset="1" stop-color="#111b30"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".24"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient></defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect width="1120" height="510" rx="24" fill="url(#bg)"/><ellipse cx="818" cy="167" rx="430" ry="300" fill="url(#glow)"/><rect x="40" y="44" width="177" height="28" rx="14" fill="#2a2550"/><text x="128" y="63" text-anchor="middle" fill="#c4b5fd" font-size="11" letter-spacing="2">DESKTOP AUTOMATION</text><text x="40" y="142" fill="#f1f5ff" font-size="48" font-weight="700" letter-spacing="-2">One tool.</text><text x="40" y="201" fill="#b5a3ff" font-size="48" font-weight="700" letter-spacing="-2">A visible workflow.</text><text x="42" y="252" fill="#d6e2f7" font-size="20">真实桌面，可见操作。</text><text x="42" y="287" fill="#93a6c5" font-size="16">DSH Agent → computer → Cua Driver</text><text x="42" y="326" fill="#7dd3fc" font-size="13">VISIBLE CURSOR  /  APPROVALS  /  AUDIT</text><g transform="translate(604 61)"><rect width="476" height="284" rx="18" fill="#172239" stroke="#43516e"/><path d="M0 43H476" stroke="#344158"/><circle cx="23" cy="23" r="4" fill="#a78bfa"/><circle cx="39" cy="23" r="4" fill="#6483aa"/><circle cx="55" cy="23" r="4" fill="#38bdf8"/><text x="454" y="28" text-anchor="end" fill="#a9bad4" font-size="12" letter-spacing="2">WINDOWS DESKTOP</text><rect x="20" y="63" width="110" height="200" rx="10" fill="#111a2d"/><rect x="34" y="82" width="80" height="27" rx="6" fill="#303458"/><text x="45" y="100" font-size="12" fill="#ddd6fe">Agent task</text><path d="M36 133H100M36 159H87M36 185H102M36 211H77" stroke="#33445f" stroke-width="6" stroke-linecap="round"/><rect x="148" y="63" width="308" height="200" rx="10" fill="#10192b"/><text x="170" y="93" font-size="12" fill="#899bb8">OBSERVATION / UI AUTOMATION</text><rect x="168" y="111" width="266" height="63" rx="8" fill="#1d2c45" stroke="#7c75cb" stroke-dasharray="5 4"/><text x="185" y="137" fill="#ecf2ff" font-size="16">Hello from dsh-computer</text><text x="185" y="158" fill="#91a5c4" font-size="12">element: s00000001:2</text><path d="M180 224C238 228 253 185 333 165" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5"/><g transform="translate(327 153)"><path d="M0 0 8 36 16 24 30 24Z" fill="url(#accent)" stroke="#e2e8ff" stroke-width="2" stroke-linejoin="round"/></g><rect x="354" y="202" width="80" height="29" rx="14" fill="#153c3d"/><text x="394" y="221" text-anchor="middle" fill="#6ee7d0" font-size="12">readback</text></g><g transform="translate(40 383)"><rect width="336" height="86" rx="14" fill="#18243a" stroke="#34405d"/><text x="20" y="29" fill="#a78bfa" font-size="12" letter-spacing="2">01 / OBSERVE</text><text x="20" y="59" fill="#e4ecfb" font-size="17">截图 + 控件树</text></g><g transform="translate(392 383)"><rect width="336" height="86" rx="14" fill="#18243a" stroke="#34405d"/><text x="20" y="29" fill="#a78bfa" font-size="12" letter-spacing="2">02 / ACT</text><text x="20" y="59" fill="#e4ecfb" font-size="17">授权后执行</text></g><g transform="translate(744 383)"><rect width="336" height="86" rx="14" fill="#18243a" stroke="#34405d"/><text x="20" y="29" fill="#a78bfa" font-size="12" letter-spacing="2">03 / VERIFY</text><text x="20" y="59" fill="#e4ecfb" font-size="17">回读实际结果</text></g><text x="1080" y="493" text-anchor="end" fill="#7f91ad" font-size="11" letter-spacing="1">WORKFLOW ILLUSTRATION</text></g></svg>
